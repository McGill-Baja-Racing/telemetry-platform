name: Bug
description: Something does not work as it should.
type: Bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The page or command, with the error message or a screenshot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
