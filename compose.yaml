services:
  db:
    image: timescale/timescaledb:2.31.0-pg18
    environment:
      POSTGRES_USER: baja
      POSTGRES_PASSWORD: baja
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U baja -d telemetry
      interval: 2s
    volumes:
      - db:/var/lib/postgresql

volumes:
  db:
